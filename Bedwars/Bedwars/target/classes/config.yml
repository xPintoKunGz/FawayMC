# ========================================================
#            BEDWARS NEXT-GEN CONFIGURATION
#              Compatible with MC 26.3 / 1.20+
# ========================================================

server:
  name: "§e§lYOUR§6§lSERVER§f.NET"
  lobby-location: ""

game:
  lobby-countdown: 15
  respawn-time: 5
  game-duration: 1200 # 20 minutes (Game Ends)
  diamond-2-time: 120 # 2 minutes
  emerald-2-time: 240 # 4 minutes
  diamond-3-time: 360 # 6 minutes
  emerald-3-time: 480 # 8 minutes
  bed-destroy-time: 600 # 10 minutes: Bed Destruction & Sudden Death
  fireball-yield: 2.2
  fireball-speed: 1.5
  fireball-cooldown: 0.5
  tnt-fuse-ticks: 50 # 2.5 seconds
  bridge-egg-max-blocks: 25

scoreboard:
  title: "§f§l✦ §6§lB§e§lE§6§lD§e§lW§6§lA§e§lR§6§lS §f§l✦"
  server-footer: "§eplay.yourserver.net"

# ========================================================
#             BASE & CENTER SPAWNER DROP RATES
# ========================================================
spawners:
  # Base Spawner (Tier 0 default)
  # Iron: interval in seconds (1s = 2 pieces), drop-amount = 2 pieces
  iron-interval: 1
  iron-drop-amount: 2
  # Gold: interval in seconds (60s = 1 minute per 1 gold), drop-amount = 1 piece
  gold-interval: 60
  gold-drop-amount: 1
  # Max items allowed on spawner pad before pausing
  iron-max-cap: 24
  gold-max-cap: 8
  # Center Spawners (seconds)
  diamond-tier1: 30
  diamond-tier2: 20
  diamond-tier3: 12
  emerald-tier1: 60
  emerald-tier2: 45
  emerald-tier3: 30

