name: MeryITEM
version: 1.0.0
main: com.merycraft.meryitem.MeryItemPlugin
api-version: '1.20'
author: MeryCraft
description: Modern, intuitive RPG Item Framework with aesthetic pastel UI and custom combat mechanics.
softdepend: [PlaceholderAPI]

commands:
  mitem:
    description: Main command for MeryITEM
    aliases: [meryitem, mupgrade]
    usage: /mitem [subcommand]
    permission: meryitem.use

permissions:
  meryitem.use:
    description: Allows opening the visual item browser
    default: true
  meryitem.admin:
    description: Full administrative access to give, save, and reload
    default: op

