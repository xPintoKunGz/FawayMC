name: HoloMery
version: 1.0.0
main: com.holomery.HoloMeryPlugin
api-version: '1.20'
author: HoloMeryTeam
description: Next-generation modern floating hologram plugin for Minecraft with Display Entities and custom multi-stop gradient color palettes.
softdepend:
  - PlaceholderAPI

commands:
  holomery:
    description: Main command for HoloMery Hologram system.
    aliases:
      - hm
      - holo
    usage: /<command> [subcommand]
    permission: holomery.admin

permissions:
  holomery.admin:
    description: Full access to create, modify and manage all HoloMery holograms.
    default: op
  holomery.use:
    description: Access to view hologram help and info.
    default: true

