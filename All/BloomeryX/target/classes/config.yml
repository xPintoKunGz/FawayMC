# ==============================================================================
#                      BloomeryX - Core Configuration
#               Distinctive Essentials Suite with LuckPerms Integration
# ==============================================================================

# General settings
settings:
  # Plugin chat prefix with hex color gradients
  # Supports standard codes &a, &b... and Hex format &#RRGGBB
  prefix: "&#FF758C[&#FF7EB3BloomeryX&#FF758C]&r "
  
  # Play nice sounds when commands succeed or fail
  enable-sounds: true
  success-sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
  error-sound: "ENTITY_VILLAGER_NO"
  teleport-sound: "ENTITY_ENDERMAN_TELEPORT"

# LuckPerms Name & Chat formatting integration
chat:
  # Enable custom BloomeryX chat formatting
  enabled: true
  
  # Format uses placeholders:
  # {prefix}      -> LuckPerms prefix
  # {suffix}      -> LuckPerms suffix
  # {group}       -> LuckPerms primary group
  # {displayname} -> Player Display Name (including /nick if set)
  # {name}        -> Real Minecraft username
  # {message}     -> Chat message
  # Also supports any PlaceholderAPI (%...)
  format: "{prefix}&f{displayname}{suffix}&8: &7{message}"
  
  # Enable LuckPerms player list (Tablist) prefix & suffix synchronization
  sync-tab-names: true
  tab-format: "{prefix}&f{displayname}{suffix}"

# Nametag & Tablist Name Formatting
nametag:
  # Enable nametag and tablist formatting
  enabled: true
  
  # Format shown in player list when pressing TAB (supports LuckPerms & PlaceholderAPI)
  tab-format: "{prefix}&f{displayname}{suffix}"
  
  # Floating Nametag above player's head (Vanilla Scoreboard Teams, NO sidebar scoreboard)
  head:
    enabled: true
    prefix: "{prefix}"
    suffix: "{suffix}"

# ==============================================================================
#                  BloomeryX Jukebox 2.0 (Custom Music Engine)
# ==============================================================================
music:
  enabled: true
  
  # Show animated soundwave visualizer on the Action Bar while music plays
  action-bar: true
  
  # Open Jukebox music menu when right-clicking a Jukebox block in the world
  jukebox-block-click: true
  
  # Synchronized server-wide radio station (Bloomery Radio)
  radio:
    enabled: true
    autoplay-on-join: false

# Chat Mention System (@PlayerName)
mention:
  enabled: true
  # Color code or Hex for the @Name tag in chat
  highlight-color: "&#FF7EB3"
  # Show on-screen Title alert to mentioned player
  show-title: true
  title: "&#FF7EB3✦ {sender} mentioned you!"
  subtitle: "&7\"{message}\""
  # Sound played when mentioned
  sound: "BLOCK_NOTE_BLOCK_BELL"
  # Message sent in chat to the mentioned player
  format-chat: "&#FF7EB3✦ [Mention] &#B2EBF2{sender} &7called you: &f\"{message}\""

# AFK System
afk:
  enabled: true
  # Minutes of inactivity before player is marked as AFK (0 to disable auto AFK)
  auto-afk-minutes: 5
  # Teleport player to the set AFK location (/setafk) when entering AFK
  teleport-on-afk: true
  # Return player to their previous location when they move/return from AFK
  return-on-active: true
  # Broadcast to the whole server when a player goes AFK or returns
  announce: true
  messages:
    enter-broadcast: "&#FF758C[AFK] &f{player} &7is now AFK (Away From Keyboard)"
    exit-broadcast: "&#70E000[AFK] &f{player} &7is no longer AFK!"

# Nickname system
nickname:
  min-length: 3
  max-length: 16
  prefix: "~"
  disallowed-regex: "[^a-zA-Z0-9_&#]"

# Teleportation & TPA
teleport:
  # TPA request timeout in seconds
  tpa-timeout: 60
  # Delay before teleporting in seconds (0 to disable delay)
  teleport-delay: 0
  # Cancel teleport if player moves
  cancel-on-move: true

# Home system
homes:
  # Default maximum homes for normal players
  default-max-homes: 3
  # Permission-based home limits:
  # bloomeryx.homes.<group_name> will receive this amount
  groups:
    vip: 5
    mvp: 10
    admin: 100

# Messages configuration
