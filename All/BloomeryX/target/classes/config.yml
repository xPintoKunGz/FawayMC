  unknown-command: "&#FF4B4B✕ &cUnknown command. Type &f/bx help &cfor all commands."
  config-reloaded: "&#70E000✔ &aBloomeryX configuration and language have been reloaded!"
  
  # Broadcast Format
  broadcast-format: "&#FF7EB3[Broadcast] &8: &f{message}"

  # Gamemode
