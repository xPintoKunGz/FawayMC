name: FawayMC-Daily
version: '1.0'
main: org.kcm.bloomery.fawaymc.daily.Global
api-version: '26.3'
softdepend: [PlaceholderAPI, FawayMC-Luckyblock]
authors: [ Bloomery Network Team, FawayMC Team, xPintoKunG_Z, Peak4567 ]

commands:
  daily:
    description: Daily rewards
    aliases: [dailyreward, dr]
    usage: /daily [claim|info]
    permission: daily.use
  dailyadmin:
    description: Daily admin commands
    aliases: [da, dailyadm]
    usage: /dailyadmin <reset|info|reload>
    permission: daily.admin

permissions:
  daily.use:
    description: Use daily rewards
    default: true
  daily.admin:
    description: Admin daily commands
    default: op