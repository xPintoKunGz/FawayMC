# FawayMC Global Configuration
bungee_servers:
  - "lobby"
  - "bedwars"

# ===== Spawn Block Protection =====
spawn_protection:
  leaves_decay: true          # ใบไม้ร่วง/เน่า
  block_fade: true            # น้ำแข็ง/หิมะละลาย
  block_burn: true            # ไฟไหม้บล็อก
  block_spread: true          # ไฟลุกลาม
  block_ignite: true          # จุดไฟ
  liquid_flow: false          # น้ำ/ลาวาไหล (ปิดไว้เพราะกิน performance)
  block_grow: false           # พืชโต (ปิดไว้เพราะกิน performance)
  entity_change_block: true   # enderman/falling sand เปลี่ยนบล็อก
  decorative_entities: true   # ห้ามทุบ armor stand / item frame / painting
  item_drop: true             # ห้ามโยนของใน spawn zone
  item_pickup: true           # ห้ามเก็บของใน spawn zone
  item_pickup_warning: false  # ส่งข้อความเตือนตอนเก็บของ (อาจ spam — default ปิด)

messages:
