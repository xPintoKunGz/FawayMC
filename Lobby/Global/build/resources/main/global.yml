    block_interact_player: "&cYou cannot interact with this object in this area."
    block_entity_damage_admin: "&cYou cannot damage this entity in this area. (Use /build on to enable)"
    block_entity_damage_player: "&cYou cannot damage this entity in this area."
    block_drop_admin: "&cYou cannot drop items in this area. (Use /build on to enable)"
    block_drop_player: "&cYou cannot drop items in this area."
    block_pickup_admin: "&cYou cannot pick up items in this area. (Use /build on to enable)"
    block_pickup_player: "&cYou cannot pick up items in this area."

    bossbar_on_vanished: "&c[Admin Mode] &fBuild: &aON &7| &fVanish: &aON"
