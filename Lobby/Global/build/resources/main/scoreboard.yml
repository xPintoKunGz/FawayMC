# FawayMC Custom Scoreboard Configuration

scoreboard:
  enabled: true
  update_ticks: 20
  page_switch_seconds: 10
  pages:
    - title: '&6&lFawayMC'
      lines:
        - '&7{date} {time}'
        - '&r'
        - '&6{player}'
        - '&6 ▪ &fRank: &a%luckperms_prefix%' # Rank
        - '&6 ▪ &fLevel Plaza: &9%level_level%' # Level
        - '&6 ▪ &fAdvancements: &3%advancement_unlocked%' # Advancement
        - '&6 ▪ &fCoins: &6%luckyblock_coins_formatted%' # Luckyblock
        - '&6 ▪ &fLucky Vault: &2%luckyblock_total_formatted%' # Luckyblock
        - '&r'
        - '&d⚑ &fFriend Online: &d%friend_online_count%'
        - '&r'
        - '&a▶ &fGlobal Players: &a%server_online%' # PAPI
        - '&a▶ &fServer: &aLobby' # PAPI
        - '&r'
        - '&ewww.fawaymc.net'
    - title: '&6&lFawayMC'
      lines:
        - '&7{date} {time}'
        - '&r'
        - '&fYou are on:'
        - ' &a▶ Lobby Server'
        - '&r'
        - '&fServers:'
        - ' &e▶ &fLobby: &e%bungee_lobby%&7/2024'
        - ' &c▶ &fBedwars: &c%bungee_bedwars%&7/200'
        - '&r'
        - '&a▶ &fGlobal Players: &a%server_online%'
        - '&r'
        - '&ewww.fawaymc.net'

title_animation:
  enabled: true
  mode: frames  # frames or scroll
  interval_ticks: 3
  frames:
    - "&f&lFawayMC"
    - "&e&lF&f&lawayMC"
    - "&6&lF&e&la&f&lwayMC"
    - "&f&lF&6&la&e&lw&f&layMC"
    - "&f&lFa&6&lw&e&la&f&lyMC"
    - "&f&lFaw&6&la&e&ly&f&lMC"
    - "&f&lFawa&6&ly&e&lM&f&lC"
    - "&f&lFaway&6&lM&e&lC"
    - "&f&lFawayM&6&lC"
    - "&f&lFawayMC"
  scroll_text: '&d&lFawayMC'
  scroll_padding: 8

messages:
  no_permission: '&cคุณไม่มีสิทธิ์ใช้งานคำสั่งนี้!'
  usage: '&eการใช้งาน: /scoreboard <on|off|reload>'
  enabled: '&aเปิดใช้งาน Scoreboard เรียบร้อยแล้ว!'
  disabled: '&cปิดใช้งาน Scoreboard เรียบร้อยแล้ว!'
  reload: '&aรีโหลดไฟล์ scoreboard.yml เรียบร้อยแล้ว!'
