name: FawayMC-Leaderboard
version: '1.0'
main: org.kcm.bloomery.fawaymc.leaderboard.Global
api-version: '26.3'
softdepend:
  - PlaceholderAPI
  - FawayMC-Advancement
  - FawayMC-Level
  - FawayMC-Luckyblock
authors: [ Bloomery Network Team, FawayMC Team, xPintoKunG_Z, Peak4567 ]

commands:
  leaderboard:
    description: Leaderboard commands
    aliases: [ lb, flb, leaderboards ]
    usage: /leaderboard <list|refresh|import|info|save>
    permission: fawayleaderboard.use
  lbholo:
    description: Manage leaderboard holograms
    aliases: [ lbhologram, lbh ]
    usage: /lbholo <create|delete|edit|list|tp|move|refresh>
    permission: fawayleaderboard.admin

permissions:
  fawayleaderboard.use:
    default: true
  fawayleaderboard.admin:
    default: op