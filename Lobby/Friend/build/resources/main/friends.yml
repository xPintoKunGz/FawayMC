# ================================
# Friend System Configuration
# ================================
database:
  # sqlite / mysql
  type: "sqlite"

  sqlite:
    file: "friends.db"

  mysql:
    host: "localhost"
    port: 3306
    database: "fawaymc_friends"
    username: "root"
    password: ""

# ================================
# Limits
# ================================
limits:
  max_friends: 50
  max_pending_requests: 20

# ================================
# Notifications
# ================================
notify:
  # แจ้งเพื่อนออนไลน์
  friend_online:
    enabled: true
    format: "&a&l✔ &f{friend} &ais now online &7({server})"

  friend_offline:
    enabled: true
    format: "&c&l✘ &f{friend} &cis now offline"

  # แจ้งเมื่อได้คำขอใหม่
  request_received:
    enabled: true
    format: "&e&l📩 &f{sender} &esent you a friend request!"
    action_bar: true     # แสดงใน actionbar ด้วย
    sound: "ENTITY_EXPERIENCE_ORB_PICKUP"

  # แจ้งเมื่อมีคนตอบรับ
  request_accepted:
    enabled: true
    format: "&a&l✔ &f{friend} &aaccepted your friend request!"

  # แจ้งเมื่อเพื่อนลบคุณ
  friend_removed:
    enabled: true
    format: "&c&l✘ &f{friend} &cremoved you from friends"

# ================================
# GUI
# ================================
gui:
  title: "&8&l✦ &b&lFRIENDS &8&l✦"
  size: 54

  border:
    material: "BLACK_STAINED_GLASS_PANE"
    name: " "

  filler:
    material: "GRAY_STAINED_GLASS_PANE"
    name: " "

  friend_online:
    material: "PLAYER_HEAD"
    # แสดง head + ใส่ enchant glow ถ้า online
    glow: true

  friend_offline:
    material: "PLAYER_HEAD"
    # ใส่ gray color ให้ head ออฟไลน์

  sort:
    # online_first / alphabetical / last_seen / favorite_first
    mode: "online_first"

# ================================
# Messages
# ================================
messages:
  prefix: "&b&lFRIENDS &8» &r"

  player_not_found: "&cไม่พบผู้เล่น &f{player}&c!"
  cannot_add_self: "&cคุณไม่สามารถเพิ่มตัวเองเป็นเพื่อนได้!"
  already_friends: "&cคุณเป็นเพื่อนกับ &f{player} &cอยู่แล้ว!"
  already_requested: "&cคุณได้ส่งคำขอให้ &f{player} &cแล้ว!"
  request_sent: "&aส่งคำขอเป็นเพื่อนให้ &f{player} &aเรียบร้อย!"

  request_received: "&e&l📩 &f{sender} &eส่งคำขอเป็นเพื่อน!"
  request_expired: "&cคำขอหมดอายุแล้ว"

  friend_added: "&a&l✔ &aคุณกับ &f{player} &aเป็นเพื่อนกันแล้ว!"
  friend_removed_self: "&c&l✘ &cลบ &f{player} &cออกจากรายการเพื่อนแล้ว"
  friend_removed_other: "&c&l✘ &f{player} &cได้ลบคุณออกจากรายการเพื่อน"

  friend_list_empty: "&7คุณยังไม่มีเพื่อน &f(ใช้ /friend add <player>)"
  friend_list_header: "&b&l✦ รายการเพื่อน &7({count}/{max}) &b&l✦"

  request_denied: "&cปฏิเสธคำขอของ &f{player} &cแล้ว"
  request_rejected: "&c&f{player} &cปฏิเสธคำขอของคุณ"

  friend_online: "&a&l● &f{friend} &aเข้าระบบ &7({server})"
  friend_offline: "&c&l● &f{friend} &cออกจากระบบ"

  requests_disabled: "&cคุณปิดรับคำขออยู่ &7(ใช้ /friend toggle requests)"
  target_requests_disabled: "&cผู้เล่น &f{player} &cปิดรับคำขอ"

  max_friends_reached: "&cคุณมีเพื่อนครบ &f{max} &cคนแล้ว!"
  max_pending_reached: "&cผู้เล่น &f{player} &cมีคำขอค้างเยอะเกินไป"