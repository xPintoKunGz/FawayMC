name: FawayMC-Friends
version: '1.0'
main: org.kcm.bloomery.fawaymc.friend.Global
api-version: '26.3'
softdepend: [PlaceholderAPI]
authors: [ Bloomery Network Team, FawayMC Team, xPintoKunG_Z, Peak4567 ]

commands:
  friend:
    description: Friend system main menu
    aliases: [friends, f]
    usage: /friend [list|add|accept|deny|remove|requests|toggle]
    permission: friend.use
  friendadmin:
    description: Friend system admin commands
    aliases: [fa, fadmin]
    usage: /friendadmin <list|clear|reload|cache>
    permission: friend.admin

permissions:
  friend.use:
    description: Use friend commands and GUI
    default: true
  friend.admin:
    description: Use friend admin commands
    default: op