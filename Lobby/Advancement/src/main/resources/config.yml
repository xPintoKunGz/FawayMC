# ═══════════════════════════════════════════════════════════
# Messages
# ═══════════════════════════════════════════════════════════
messages:
  unlocked: "&a&l✔ &aAdvancement Unlocked: &e{name}"
  unlocked_broadcast: "&6{player} &eunlocked &6{name}&e!"
  progress: "&e{name} &7- &f{current}&7/&f{required} &7({percent}%)"
  already_unlocked: "&cYou already have this advancement!"
  not_found: "&cAdvancement not found: {id}"
  reset_done: "&aReset all advancements for &e{player}"