luckyblock:
  enabled: true

# Holograms + Chests
vault:
  max_boxes: 1000
  chest_locations: []
  hologram:
    enabled: true
    height_offset: 2
    line_spacing: 0.28
    lines:
      - "&6&l✦ &e&l&nLUCKY VAULT&e&l &6&l✦"
      - "&fRight-click to open!"
      - ""
      - "&7&oOpen boxes to unlock cosmetics!"
  actionbar:
    enabled: false
    update_ticks: 20          # อัปเดตทุก 1 วินาที
    message: "&6&lLucky Boxes &8» &fCommon: &a{common} &f| Rare: &b{rare} &f| Epic: &5{epic} &f| Leg: &6{legendary} &f| Mythic: &c{mythic}"
  animation:
    enabled: true
    check_radius: 10
    update_tier_ticks: 20
    tiers:
      # ══════ Empty — ไม่มีกล่อง ══════
      empty:
        min_boxes: 0
        max_boxes: 0
        layers:
          - type: "RING"
            particle: "ENCHANT"
            count: 3
            radius: 1.0
            height: 0.2
            interval_ticks: 15

      # ══════ Low — 1-4 กล่อง ══════
      low:
        min_boxes: 1
        max_boxes: 4
        layers:
          - type: "RING"
            particle: "ENCHANT"
            count: 4
            radius: 1.2
            height: 0.2
            interval_ticks: 12
          # ★ ใหม่: หัวใจลอยเบาๆ
          - type: "FOUNTAIN"
            particle: "HEART"
            count: 2
            radius: 0.6
            height: 1.0
            interval_ticks: 30

      # ══════ Medium — 5-19 กล่อง ══════
      medium:
        min_boxes: 5
        max_boxes: 19
        layers:
          - type: "RING"
            particle: "ENCHANT"
            count: 5
            radius: 1.3
            height: 0.2
            interval_ticks: 10
          # ★ ใหม่: เวทมนตร์ม่วง tornado เล็ก
          - type: "TORNADO"
            particle: "SPELL_WITCH"
            count: 4
            radius: 0.8
            height: 1.2
            interval_ticks: 12
          # ★ ใหม่: เมฆลอยเป็นวงโคจร
          - type: "ORBIT"
            particle: "CLOUD"
            count: 3
            radius: 1.5
            height: 0.9
            interval_ticks: 15

      # ══════ High — 20-49 กล่อง ══════
      high:
        min_boxes: 20
        max_boxes: 49
        layers:
          - type: "RING"
            particle: "ENCHANT"
            count: 6
            radius: 1.4
            height: 0.2
            interval_ticks: 8
          - type: "TORNADO"
            particle: "PORTAL"
            count: 5
            radius: 1.0
            height: 1.5
            interval_ticks: 10
          # ★ ใหม่: เปลวไฟสีฟ้า spiral
          - type: "SPIRAL"
            particle: "SOUL_FIRE_FLAME"
            count: 4
            radius: 0.7
            height: 1.0
            interval_ticks: 10
          # ★ ใหม่: แท่งแสง helix
          - type: "HELIX"
            particle: "END_ROD"
            count: 4
            radius: 1.4
            height: 1.3
            interval_ticks: 12

      # ══════ Legendary — 50+ กล่อง ══════
      legendary:
        min_boxes: 50
        max_boxes: 999999
        layers:
          - type: "RING"
            particle: "ENCHANT"
            count: 6
            radius: 1.5
            height: 0.2
            interval_ticks: 8
          # ★ ใหม่: คลื่นเปลวไฟ
          - type: "WAVE"
            particle: "FLAME"
            count: 5
            radius: 1.3
            height: 0.3
            interval_ticks: 10
          - type: "TORNADO"
            particle: "PORTAL"
            count: 6
            radius: 1.0
            height: 1.5
            interval_ticks: 8
          # ★ ใหม่: totem (สีทอง) spiral
          - type: "SPIRAL"
            particle: "TOTEM_OF_UNDYING"
            count: 4
            radius: 0.8
            height: 1.0
            interval_ticks: 12
          - type: "HELIX"
            particle: "END_ROD"
            count: 4
            radius: 1.3
            height: 1.2
            interval_ticks: 12
          # ★ ใหม่: ดอกไม้ไฟ burst (นานๆ ครั้ง)
          - type: "BURST"
            particle: "FIREWORK"
            count: 8
            radius: 0.6
            height: 0.8
            interval_ticks: 30

