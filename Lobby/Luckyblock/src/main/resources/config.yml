# Spin Animation
opening:
  gui_title: "&8&l✦ &e&lOpening... &8&l✦"
  gui_size: 27
  multi_title: "&8&l✦ &e&lOpening &f{amount}x &e&lBoxes &8&l✦"
  multi_spin_duration_ticks: 80     # spin เร็วขึ้น (x5/x10/x25)
  multi_reveal_hold_ticks: 80       # แสดงผลทั้งหมด 4 วินาทีก่อนปิด
  border_material: "BLACK_STAINED_GLASS_PANE"
  spin_slots: [10, 11, 12, 13, 14, 15, 16]
  result_slot: 13
  spin_duration_ticks: 120
  spin_update_ticks: 2
  reward_delay_ticks: 40
  physical:
    box_distance: 2.0
    box_height: 2.5
    box_scale: 0.6
    item_scale: 0.4
    spin_duration_ticks: 200
    fly_duration_ticks: 40
    spin_radius: 1.5
    spin_height_offset: 0.3
    item_count: 8
    rotation_speed: 0.08
    vault_chest_search_radius: 15.0
    # ความสูงของกล่อง luckyblock ที่ spawn เหนือ enderchest
    box_height_above_chest: 2.0
    # เสียงวนตอน items orbit
    orbit_sound:
      enabled: true
      sound: BLOCK_NOTE_BLOCK_CHIME
      interval_ticks: 4
      volume: 0.4
      pitch: 1.6
    # เสียงเตือนก่อนพุ่งเข้าตัว
    warn_sound:
      enabled: true
      sound: ENTITY_WARDEN_SONIC_CHARGE
      countdown_start_ticks: 12   # เริ่มเตือน 12 tick ก่อนพุ่ง
      beeps: 4                    # จำนวน beeps
    # ★★★ NEW: Box hologram ★★★
      box_hologram:
        enabled: true
        height: 0.9                              # ความสูงเหนือกล่อง
        text: "&e&l✦ &f{box_name} &e&l✦"         # {box_name} = display_name ของกล่อง
    # ★★★ NEW: Item hologram ★★★
      item_hologram:
        enabled: true
        height: 0.55                             # ความสูงเหนือไอเท็มแต่ละชิ้น
        scale: 0.8                               # ขนาดตัวอักษร (1.0 = ปกติ)
    # ★★★ NEW: Phase timings ★★★
      freeze_pause_ticks: 20                     # หยุดนิ่งหลัง lock winner (ไอเท็ม glow)
      move_to_center_ticks: 25                   # เวลาย้าย winner เข้ากลาง
      center_pause_ticks: 20

# ================================
# Gadget Settings
# ================================
gadget:
  hotbar_slot: 5                  # slot ใน hotbar (0-8) สำหรับ gadget
  message_cooldown_ms: 1000       # throttle ข้อความ cooldown (ms)
  cooldown_bar:
    enabled: true
    type: "BOSS_BAR"              # "BOSS_BAR" หรือ "ACTION_BAR"
    color: "RED"                  # BOSS_BAR: PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
    style: "SEGMENTED_10"          # BOSS_BAR: SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
    title: "&c&l✦ &fGadget Cooldown &c&l✦ &7(&e{remaining}s&7)"
    action_bar:
      bar_length: 20              # จำนวนแท่ง
      filled_char: "|"
      empty_char: "|"
      filled_color: "&a"
      empty_color: "&c"
      message: "{bar} &e{remaining}s"

