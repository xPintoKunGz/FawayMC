# ═══════════════════════════════════════════════════════════
# FawayLevel Configuration
# ═══════════════════════════════════════════════════════════

level:
  max_level: 100

  # EXP formula ที่ใช้คำนวณ EXP ที่ต้องใช้ในแต่ละเลเวล
  # LINEAR:      base + (level - 1) * increment
  # EXPONENTIAL: base * (multiplier ^ (level - 1))
  formula:
    type: LINEAR
    base: 100
    increment: 50
    multiplier: 1.5

  # แหล่ง EXP
  exp_sources:
    join:
      enabled: false
      amount: 10
    playtime:
      enabled: false
      interval_minutes: 5    # ให้ทุก 5 นาที
      amount: 25

# ─────────────────────────────────────────────
# Display
# ─────────────────────────────────────────────
display:
  tab:
    enabled: false
    format: "&8[&eLv.{level}&8] &f{player}"
    require_permission: false
    update_ticks: 20

  exp_bar:
    enabled: true
    update_ticks: 20
    block_vanilla_xp: true    # บล็อก vanilla XP ไม่ให้ทับ bar

# ─────────────────────────────────────────────
# Placeholder
# ─────────────────────────────────────────────
placeholder:
  bar_length: 20
  bar_filled: "&a█"
  bar_empty: "&7░"

# ─────────────────────────────────────────────
# Storage
# ─────────────────────────────────────────────
storage:
  auto_save_minutes: 5

# ─────────────────────────────────────────────
# Messages
# ─────────────────────────────────────────────
messages:
  level_up: "&a&lLEVEL UP! &eYou reached level &f{level}&e!"
  level_up_broadcast: false
  level_up_broadcast_format: "&6{player} &ehas reached level &6{level}&e!"

# ─────────────────────────────────────────────
# Rewards — รันคำสั่งเมื่อถึงเลเวลที่กำหนด
# ─────────────────────────────────────────────
rewards: {}
