# FawayMC Items Configuration
# Config for player items: Server Selector GUI, Profile Menu, Visibility

# ===== Server Selector GUI =====
gui:
  menu_title: "&8&l[&b&l FawayMC Network Selector &8&l]"
  size: 27

  open_item:
    enabled: true
    slot: 4
    material: "NETHER_STAR"
    name: "&b&lServer Selector &7(Right-Click)"
    lore:
      - "&7Access the main network navigation menu"
      - "&7to join available game modes."
      - ""
      - "&eClick to open!"

  items:
    survival:
      slot: 11
      material: "DIAMOND_SWORD"
      name: "&a&lSurvival Mode"
      lore:
        - "&7Experience the classic survival journey"
        - "&7with custom features and economy."
        - ""
        - "&8■ &fCategory: &aMain Realm"
        - "&8■ &fVersion: &f1.20+"
        - ""
        - "&eClick to connect to server!"
      action: "server survival"
    creative:
      slot: 13
      material: "BRICKS"
      name: "&b&lCreative Mode"
      lore:
        - "&7Unleash your architectural creativity"
        - "&7in a boundless plot environment."
        - ""
        - "&8■ &fCategory: &bBuilding Realm"
        - "&8■ &fVersion: &f1.20+"
        - ""
        - "&eClick to connect to server!"
      action: "server creative"
    minigames:
      slot: 15
      material: "FIREWORK_ROCKET"
      name: "&e&lMini-Games"
      lore:
        - "&7Challenge your skills and compete with"
        - "&7friends in fast-paced minigames."
        - ""
        - "&8■ &fCategory: &eArcade Realm"
        - "&8■ &fVersion: &f1.20+"
        - ""
        - "&eClick to connect to server!"
      action: "server minigames"

  messages:
    open_success: "&aSuccessfully opened the server selector menu."
    action_executed: "&eConnecting you to &f{target}&e..."
    not_configured: "&cThis item has not been configured yet."

# ===== Player Profile =====
profile:
  item:
    enabled: true
    slot: 0
    name: "&aMy Profile &7(Right-Click)"
    lore:
      - "&7View your personal statistics, social media"
      - "&7links, and lobby preference settings."
      - ""
      - "&eClick to open!"

  gui:
    title: "&8&l[&e&l Player Profile &8&l]"
    size: 36
    items:
      status:
        slot: 13
        material: "PLAYER_HEAD"
        name: "&a&lProfile Overview &7(&f{player}&7)"
        lore:
          - "&7View all your current statistics and progress"
          - "&7across the FawayMC Network."
          - ""
          - "&8■ &eCoins: &a{coins}"
          - "&8■ &cKills: &f{kills}"
          - "&8■ &bDeaths: &f{deaths}"
          - ""
          - "&eClick to refresh!"

      discord:
        slot: 20
        material: "BLUE_BANNER"
        name: "&b&lDiscord Community"
        lore:
          - "&7Join our official Discord server to chat with"
          - "&7the community and get event updates!"
          - ""
          - "&8■ &fLink: &bhttps://discord.gg/fawaymc"
          - ""
          - "&eClick to view link!"
        link: "&b&lDISCORD &8» &fhttps://discord.gg/fawaymc"

      website:
        slot: 22
        material: "NETHER_STAR"
        name: "&a&lOfficial Store & Website"
        lore:
          - "&7Visit our official store to support the"
          - "&7server and purchase ranks or perks!"
          - ""
          - "&8■ &fLink: &ahttps://www.fawaymc.net"
          - ""
          - "&eClick to view link!"
        link: "&a&lSTORE &8» &fhttps://www.fawaymc.net"

      socials:
        slot: 24
        material: "REDSTONE"
        name: "&c&lMedia & YouTube"
        lore:
          - "&7Check out official trailers, mini-game"
          - "&7highlights, and community creators!"
          - ""
          - "&8■ &fLink: &chttps://youtube.com/@FawayMC"
          - ""
          - "&eClick to view link!"
        link: "&c&lYOUTUBE &8» &fhttps://youtube.com/@FawayMC"

      double_jump_toggle:
        enabled: true
        slot: 31
        material_on: "FEATHER"
        material_off: "GRAY_DYE"
        name_on: "&a&lDouble Jump: ON"
        name_off: "&c&lDouble Jump: OFF"
        lore_on:
          - "&7Toggle your lobby double jump ability"
          - "&7ON or OFF."
          - ""
          - "&8■ &fStatus: &aENABLED"
          - ""
          - "&eClick to toggle!"
        lore_off:
          - "&7Toggle your lobby double jump ability"
          - "&7ON or OFF."
          - ""
          - "&8■ &fStatus: &cDISABLED"
          - ""
          - "&eClick to toggle!"

